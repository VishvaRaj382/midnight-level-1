name: PrivAI Finance Midnight CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --include=optional

      - name: TypeScript Type Check
        run: npx tsc --noEmit

      - name: Run Vitest Unit & Circuit Tests
        run: npm test

      - name: Verify Preprod Contract Deployment
        run: npm run deploy

      - name: Build Production Bundle
        run: npm run build
