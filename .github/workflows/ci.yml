name: AIShield Midnight CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Run 50 Preprod User Address Verification
        run: npm run verify-users

      - name: Run Vitest Unit Tests
        run: npm run test

      - name: Build Production Bundle
        run: npm run build
